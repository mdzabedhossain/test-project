[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zabedsec"
version = "0.1.0"
description = "Defensive-first authorized security assessment toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ZabedSec Project"}]

[project.scripts]
zabedsec = "zabedsec.cli:main"

[tool.setuptools]
packages = ["zabedsec"]
