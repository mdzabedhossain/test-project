<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZabedWhats</title><link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script></head><body><div id="login"><div class="loginbox"><div class="logo">💬</div><h1>ZabedWhats</h1><p>Private real-time chat demo</p><input id="name" placeholder="Enter your name" maxlength="30"><button id="join">Start chatting</button></div></div><main id="app" hidden><header><strong>💬 ZabedWhats</strong><span id="status">0 online</span></header><div class="layout"><aside><h3>Contacts</h3><ul id="users"></ul></aside><section class="chat"><div class="top"><b>General Chat</b><small id="typing"></small></div><div id="messages"></div><form id="form"><input id="input" placeholder="Type a message" autocomplete="off"><button>➤</button></form></section></div></main><script>const s=io(),$=x=>document.getElementById(x);$('join').onclick=()=>{let n=$('name').value.trim();if(!n)return;$('login').hidden=true;$('app').hidden=false;s.emit('join',n);$('input').focus()};$('name').onkeydown=e=>e.key==='Enter'&&$('join').click();$('form').onsubmit=e=>{e.preventDefault();let x=$('input').value.trim();if(x){s.emit('message',x);$('input').value='';s.emit('typing',false)}};$('input').oninput=e=>s.emit('typing',!!e.target.value);function add(x,c=''){let d=document.createElement('div');d.className='bubble '+c;d.textContent=x;$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight}s.on('message',m=>add(`${m.user}  ${m.time}\n${m.text}`));s.on('system',m=>add(m,'system'));s.on('users',u=>{$('status').textContent=u.length+' online';$('users').innerHTML=u.map(x=>'<li>🟢 '+x+'</li>').join('')});s.on('typing',u=>{$('typing').textContent=u?u+' is typing…':''});s.on('joined',u=>add('You joined as '+u,'system'));</script></body></html>
