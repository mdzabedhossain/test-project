<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZabedChat</title><link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script></head>
<body><main class="app"><header><div><h1>💬 ZabedChat</h1><p>Real-time team chat</p></div><span id="online">0 online</span></header>
<section id="login" class="card"><h2>Join the chat</h2><input id="name" maxlength="30" placeholder="Your name"><button id="join">Join Chat</button></section>
<section id="chat" hidden><aside><h3>Online users</h3><ul id="users"></ul></aside><div class="room"><div id="messages"></div><form id="form"><input id="input" autocomplete="off" placeholder="Type a message…"><button>Send</button></form></div></section></main>
<script>const s=io();const $=id=>document.getElementById(id);$('join').onclick=()=>{const n=$('name').value.trim();if(!n)return;$('login').hidden=true;$('chat').hidden=false;$('input').focus();s.emit('join',n)};$('form').onsubmit=e=>{e.preventDefault();const v=$('input').value.trim();if(v){s.emit('chat',v);$('input').value=''}};function add(t,c=''){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}s.on('chat',m=>add(`${m.user}: ${m.text}`));s.on('system',m=>add(m,'system'));s.on('users',u=>{$('online').textContent=u.length+' online';$('users').innerHTML=u.map(x=>`<li>🟢 ${x}</li>`).join('')});$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('join').click()});</script></body></html>
