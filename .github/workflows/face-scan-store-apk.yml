name: Build Face Scan Store APK
on:
  push:
    paths:
      - 'face-scan-store/**'
      - '.github/workflows/face-scan-store-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: face-scan-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FaceScanStore-debug-apk
          path: face-scan-store/app/build/outputs/apk/debug/app-debug.apk
