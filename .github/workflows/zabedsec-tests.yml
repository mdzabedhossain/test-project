name: ZabedSec tests

on:
  push:
    paths:
      - 'zabedsec/**'
      - '.github/workflows/zabedsec-tests.yml'
  pull_request:
    paths:
      - 'zabedsec/**'
      - '.github/workflows/zabedsec-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s zabedsec/tests -p 'test_*.py'
